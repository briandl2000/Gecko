name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  # =============================================================================
  # Build & Test - Clang only (clang on Linux, clang-cl on Windows)
  # =============================================================================
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libx11-dev libxext-dev
      
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install ninja llvm
      
      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Configure
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            export CC=clang-cl
            export CXX=clang-cl
          else
            export CC=clang
            export CXX=clang++
          fi
          cmake -S . -B out/build -G "Ninja Multi-Config" -DGECKO_BUILD_TESTS=ON
      
      - name: Build
        run: cmake --build out/build --config Release
      
      - name: Run tests
        shell: bash
        run: |
          if [ -f "./out/bin/Release/tests/math_tests.exe" ]; then
            ./out/bin/Release/tests/math_tests.exe
          elif [ -f "./out/bin/Release/tests/math_tests" ]; then
            ./out/bin/Release/tests/math_tests
          else
            echo "Test executable not found!"
            exit 1
          fi

  # =============================================================================
  # Package - only on push (merge) to dev or main
  # =============================================================================
  package:
    name: Package (${{ matrix.os }})
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libx11-dev libxext-dev zip
      
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja llvm
      
      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      
      - name: Configure
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            export CC=clang-cl
            export CXX=clang-cl
          else
            export CC=clang
            export CXX=clang++
          fi
          cmake -S . -B out/build -G "Ninja Multi-Config"
      
      - name: Build Release
        run: cmake --build out/build --config Release
      
      - name: Get version info
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*project(Gecko VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          PRERELEASE=$(sed -n 's/.*GECKO_VERSION_PRERELEASE "\([^"]*\)".*/\1/p' CMakeLists.txt)
          
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
            if [ -n "$PRERELEASE" ]; then
              VERSION_STR="${VERSION}-${PRERELEASE}-dev.${TIMESTAMP}"
            else
              VERSION_STR="${VERSION}-dev.${TIMESTAMP}"
            fi
          else
            if [ -n "$PRERELEASE" ]; then
              VERSION_STR="${VERSION}-${PRERELEASE}"
            else
              VERSION_STR="${VERSION}"
            fi
          fi
          
          echo "version=${VERSION_STR}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION_STR}" >> $GITHUB_OUTPUT
      
      - name: Install to package directory
        run: cmake --install out/build --prefix out/package/gecko-${{ steps.version.outputs.version }} --config Release
      
      - name: Create zip (Linux)
        if: runner.os == 'Linux'
        run: |
          cd out/package
          zip -r gecko-${{ steps.version.outputs.version }}-${{ matrix.platform }}.zip gecko-${{ steps.version.outputs.version }}
      
      - name: Create zip (Windows)
        if: runner.os == 'Windows'
        run: |
          cd out/package
          Compress-Archive -Path gecko-${{ steps.version.outputs.version }} -DestinationPath gecko-${{ steps.version.outputs.version }}-${{ matrix.platform }}.zip
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gecko-${{ steps.version.outputs.version }}-${{ matrix.platform }}
          path: out/package/*.zip
          retention-days: ${{ github.ref == 'refs/heads/dev' && 7 || 90 }}

  # =============================================================================
  # Release - create GitHub release after packaging (dev and main)
  # =============================================================================
  release:
    name: Create Release
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version
        id: version
        run: |
          VERSION=$(sed -n 's/.*project(Gecko VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          PRERELEASE=$(sed -n 's/.*GECKO_VERSION_PRERELEASE "\([^"]*\)".*/\1/p' CMakeLists.txt)
          
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
            if [ -n "$PRERELEASE" ]; then
              VERSION_STR="${VERSION}-${PRERELEASE}-dev.${TIMESTAMP}"
            else
              VERSION_STR="${VERSION}-dev.${TIMESTAMP}"
            fi
            echo "version=${VERSION_STR}" >> $GITHUB_OUTPUT
            echo "tag=v${VERSION_STR}" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            if [ -n "$PRERELEASE" ]; then
              echo "version=${VERSION}-${PRERELEASE}" >> $GITHUB_OUTPUT
              echo "tag=v${VERSION}-${PRERELEASE}" >> $GITHUB_OUTPUT
              echo "prerelease=true" >> $GITHUB_OUTPUT
            else
              echo "version=${VERSION}" >> $GITHUB_OUTPUT
              echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
              echo "prerelease=false" >> $GITHUB_OUTPUT
            fi
          fi
      
      - name: Delete previous dev releases
        if: github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete all previous dev releases to keep releases clean
          gh release list --limit 100 --json tagName,isPrerelease \
            -q '.[] | select(.isPrerelease and (.tagName | contains("-dev."))) | .tagName' \
          | while read -r tag; do
            echo "Deleting old dev release: $tag"
            gh release delete "$tag" --yes --cleanup-tag || true
          done
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: gecko-*
      
      - name: Collect packages
        run: |
          mkdir -p release
          find artifacts -name "*.zip" -exec cp {} release/ \;
          ls -la release/
      
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          else
            PRERELEASE_FLAG=""
          fi
          
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            TITLE="Gecko Dev Build ${{ steps.version.outputs.version }}"
          else
            TITLE="Gecko ${{ steps.version.outputs.version }}"
          fi
          
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${TITLE}" \
            ${PRERELEASE_FLAG} \
            --generate-notes \
            release/*.zip
