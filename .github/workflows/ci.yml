name: Build and Release

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  version-check:
    name: Version check
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a version change for main
        shell: bash
        run: |
          current=$(sed -n 's/^#define GECKO_VERSION_FULL_STRING "\([^"]*\)"/\1/p' include/gecko/version.h)
          previous=$(git show origin/main:include/gecko/version.h | sed -n 's/^#define GECKO_VERSION_FULL_STRING "\([^"]*\)"/\1/p')
          echo "main=$previous pull-request=$current"
          if [ -z "$current" ] || [ "$current" = "$previous" ]; then
            echo "::error::Change GECKO_VERSION_FULL_STRING before merging to main."
            exit 1
          fi

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            artifact: linux-x86_64
          - name: Windows x86_64
            os: windows-latest
            artifact: windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-14 g++-14 lld glslc zip \
            libvulkan-dev libx11-dev libxrandr-dev \
            libwayland-dev wayland-protocols libwayland-cursor0 libxkbcommon-dev

      - name: Enable MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Vulkan SDK
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true
          stripdown: true

      - name: Build and test SDK
        if: runner.os == 'Linux'
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          python3 build.py sdk
          python3 build.py release sdk-test

      - name: Build and test SDK
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          python build.py sdk
          python build.py release sdk-test

      - name: Package Linux engine
        if: runner.os == 'Linux' && github.event_name == 'push'
        run: |
          cd out/sdk
          zip -r ../gecko-linux-x86_64.zip .

      - name: Package Windows engine
        if: runner.os == 'Windows' && github.event_name == 'push'
        shell: pwsh
        run: |
          Compress-Archive -Path out/sdk/* -DestinationPath out/gecko-windows-x86_64.zip

      - name: Upload release package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: gecko-${{ matrix.artifact }}
          path: out/*.zip
          retention-days: ${{ github.ref == 'refs/heads/dev' && 7 || 90 }}

  release:
    name: Publish version
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: gecko-*

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          base=$(sed -n 's/^#define GECKO_VERSION_FULL_STRING "\([^"]*\)"/\1/p' include/gecko/version.h)
          if [ -z "$base" ]; then
            echo "Could not read GECKO_VERSION_FULL_STRING" >&2
            exit 1
          fi
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            version="${base}-dev.$(date -u +%Y%m%d%H%M%S)"
            prerelease=true
          else
            version="$base"
            case "$base" in
              *-*) prerelease=true ;;
              *) prerelease=false ;;
            esac
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Collect packages
        run: |
          mkdir release
          find artifacts -name '*.zip' -exec cp {} release/ \;

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=(--generate-notes)
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            flags+=(--prerelease)
          fi
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            flags+=(--latest=false)
          fi
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Gecko ${{ steps.version.outputs.version }}" \
            "${flags[@]}" release/*.zip
